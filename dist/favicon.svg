<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" />
  
  <!-- Outer Subtle Ring -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Main Calendar Card Icon -->
  <g filter="url(#shadow)">
    <!-- Calendar Body -->
    <rect x="112" y="144" width="288" height="256" rx="36" fill="url(#cardGrad)"/>

    <!-- Calendar Top Header -->
    <path d="M 112 180 C 112 160.1 128.1 144 148 144 L 364 144 C 383.9 144 400 160.1 400 180 L 400 216 L 112 216 Z" fill="#0284c7"/>

    <!-- Rings -->
    <rect x="168" y="112" width="24" height="48" rx="12" fill="#ffffff"/>
    <rect x="320" y="112" width="24" height="48" rx="12" fill="#ffffff"/>

    <!-- Grid Dots / Appointments -->
    <circle cx="168" cy="264" r="16" fill="#0284c7" />
    <circle cx="256" cy="264" r="16" fill="#38bdf8" />
    <circle cx="344" cy="264" r="16" fill="#10b981" />

    <circle cx="168" cy="336" r="16" fill="#38bdf8" />
    <circle cx="256" cy="336" r="16" fill="#10b981" />
    <!-- Checkmark on active appointment -->
    <circle cx="344" cy="336" r="22" fill="#10b981" />
    <path d="M 334 336 L 341 343 L 354 329" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Sparkle / Star in top corner -->
  <path d="M 400 70 L 408 92 L 430 100 L 408 108 L 400 130 L 392 108 L 370 100 L 392 92 Z" fill="#fef08a" />
</svg>
